[package]
name = "whalli"
version = "0.1.0"
edition = "2024"

[dependencies]
mio = { version = "1.2.3", features = ["net", "os-poll", "os-ext"] }
tower-lsp = "0.20.0"
tokio = { version = "1.32", features = ["full"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-deque = "0.8"
httparse = "1.9"
ureq = { version = "3.4", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
postgres = { version = "0.19", default-features = false }
mysql = { version = "25.0", default-features = false }